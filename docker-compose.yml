name: signal-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signal_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal_lab}
      POSTGRES_DB: ${POSTGRES_DB:-signal_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signal_lab} -d ${POSTGRES_DB:-signal_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: development
      BACKEND_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-signal_lab}:${POSTGRES_PASSWORD:-signal_lab}@postgres:5432/${POSTGRES_DB:-signal_lab}?schema=public
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/nest-cli.json:/app/apps/backend/nest-cli.json:ro
      - ./apps/backend/tsconfig.json:/app/apps/backend/tsconfig.json:ro
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: sh -c "corepack enable && pnpm --filter @signal-lab/backend prisma:generate && pnpm --filter @signal-lab/backend prisma:migrate && pnpm --filter @signal-lab/backend dev"
    labels:
      app: signal-lab

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_GRAFANA_URL: http://localhost:3100/d/signal-lab/signal-lab-observability
      NEXT_PUBLIC_METRICS_URL: http://localhost:3001/metrics
      NEXT_PUBLIC_LOKI_EXPLORE_URL: http://localhost:3100/explore
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/next-env.d.ts:/app/apps/frontend/next-env.d.ts:ro
      - ./apps/frontend/next.config.ts:/app/apps/frontend/next.config.ts:ro
      - ./apps/frontend/postcss.config.mjs:/app/apps/frontend/postcss.config.mjs:ro
      - ./apps/frontend/tailwind.config.ts:/app/apps/frontend/tailwind.config.ts:ro
      - ./apps/frontend/tsconfig.json:/app/apps/frontend/tsconfig.json:ro
      - frontend-next-cache:/app/apps/frontend/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: sh -c "corepack enable && pnpm --filter @signal-lab/frontend dev"
    labels:
      app: signal-lab

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "${LOKI_PORT:-3101}:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  frontend-next-cache:
